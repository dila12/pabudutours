<div class="package-item" [routerLink]="routerLink">
  <!-- Image Section -->
  <div class="package-image-container">
    <img [src]="image" alt="{{ title }}" class="package-image" />
    <div class="package-badge">
      <i class="fa fa-star"></i> {{ rating }}
    </div>
  </div>

  <!-- Content Section -->
  <div class="package-content">
    <!-- Title -->
    <h3 class="package-title">{{ title }}</h3>

    <!-- Info Badges -->
    <div class="info-badges">
      <span class="badge-item">
        <i class="fa fa-calendar-alt"></i> {{ days }}
      </span>
      <span class="badge-item">
        <i class="fa fa-users"></i> {{ persons }}
      </span>
    </div>

    <!-- Benefits -->
    <div class="benefits-section">
      <div class="benefit-item">
        <i class="fa fa-check"></i>
        <span>Reserve Now, Pay Later</span>
      </div>
      <div class="benefit-item">
        <i class="fa fa-check"></i>
        <span>Pay at Destination</span>
      </div>
      <div class="benefit-item">
        <i class="fa fa-check"></i>
        <span>Free Cancellation</span>
      </div>
    </div>

    <!-- Price Section -->
    <div class="price-section">
      <div class="price-display">
        <span class="price-currency">$</span>
        <span class="price-amount">{{ (price/2) | number:'1.0-0' }}</span>
        <span class="price-per">/person</span>
      </div>
      <a [routerLink]="routerLink" class="book-btn">
        Book Now <i class="fa fa-arrow-right"></i>
      </a>
    </div>
  </div>
</div>
