<div class="container tour-split mt-4">
  <div class="tour-split__gallery">
    <app-tour-image-gallery [images]="images" alt="Tour image"></app-tour-image-gallery>
  </div>

  <div class="tour-split__main">
    <app-tour-details-component [tour]="tourForDetails">
      <app-tour-booking-sidebar
        tourBooking
        [filecode]="tour.filecode"
        [tour]="tour"
        [image]="images[0]"
        [price]="price"
        [persons]="tour.persons">
      </app-tour-booking-sidebar>
    </app-tour-details-component>
  </div>
</div>

<div class="container-fluid py-5">
  <div class="container pt-5 pb-3">
    <div class="text-center mb-3 pb-3">
      <p class="text-primary text-uppercase" style="letter-spacing: 5px;">You might also like...</p>
      <h2>Related tours</h2>
    </div>
    <div class="row">
      <div class="col-lg-4 col-md-6 mb-4" *ngFor="let tour of selectedTours">
        <app-package-item-component
          [image]="tour.image"
          [days]="tour.days"
          [persons]="tour.persons"
          [rating]="tour.rating"
          [price]="tour.price"
          [title]="tour.title"
          [filecode]="tour.filecode"
          [routerLink]="tour.routerLink"
          [titleLevel]="3">
        </app-package-item-component>
      </div>
    </div>
  </div>
</div>
