<!-- Header Start -->
<div class="container-fluid page-header">
    <div class="container">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
            <h3 class="display-4 text-white text-uppercase">Packages</h3>
            <div class="d-inline-flex text-white">
                <p class="m-0 text-uppercase"><a class="text-white" href="">Home</a></p>
                <i class="fa fa-angle-double-right pt-1 px-3"></i>
                <p class="m-0 text-uppercase">Packages</p>
            </div>
        </div>
    </div>
</div>
<!-- Header End -->


<!-- Packages Start -->
<div class="container-fluid packages-section">
    <div class="container">
        <!-- Header -->
        <div class="packages-header">
            <h6 class="text-primary text-uppercase">Packages</h6>
            <h1>Perfect Tour Packages</h1>
            <p class="header-subtitle">Choose from our curated selection of unforgettable journeys</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs-container">
            <button 
                class="tab-button" 
                [class.active]="activeTab==='multi'" 
                (click)="setTab('multi')">
                Multi-Day Tours
            </button>
            <button 
                class="tab-button" 
                [class.active]="activeTab==='day'" 
                (click)="setTab('day')">
                Day Tours
            </button>
            <div class="tab-slider" [class.day]="activeTab==='day'"></div>
        </div>

        <!-- Card Stack Layout -->
        <div class="card-stack-container">
            <!-- Featured Large Card -->
            <div class="featured-card-section">
                <app-package-item-component 
                    *ngIf="featuredTour"
                    [image]="featuredTour.image" 
                    [days]="featuredTour.days" 
                    [persons]="featuredTour.persons"
                    [rating]="featuredTour.rating" 
                    [price]="featuredTour.price" 
                    [title]="featuredTour.title" 
                    [routerLink]="featuredTour.routerLink"
                    class="featured-card">
                </app-package-item-component>
            </div>

            <!-- Preview Cards Grid -->
            <div class="preview-cards-grid">
                <div 
                    *ngFor="let tour of activeTab==='day' ? dayTours : multiDayTours"
                    class="preview-card"
                    [class.active]="tour === featuredTour"
                    (click)="setFeaturedTour(tour)">
                    <div class="preview-image-wrapper">
                        <img [src]="tour.image" [alt]="tour.title" class="preview-image">
                        <div class="preview-overlay" *ngIf="tour === featuredTour">
                            <i class="fa fa-check-circle"></i>
                        </div>
                    </div>
                    <div class="preview-info">
                        <h4 class="preview-title">{{ tour.title }}</h4>
                        <div class="preview-meta">
                            <span class="meta-item">
                                <i class="fa fa-calendar-alt"></i> {{ tour.days }}
                            </span>
                            <span class="meta-item">
                                <i class="fa fa-star"></i> {{ tour.rating }}
                            </span>
                        </div>
                        <span class="preview-price">$ {{ (tour.price/2) | number:'1.0-0' }}</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<!-- Packages End -->

<router-outlet></router-outlet>
<!-- Destination Start -->
