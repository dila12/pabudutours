<!-- Header Start -->
<div class="container-fluid page-header">
    <div class="container">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
            <p class="display-4 text-white text-uppercase mb-0">{{ 'packages.pageTitle' | translate }}</p>
            <div class="d-inline-flex text-white">
                <p class="m-0 text-uppercase"><a class="text-white" routerLink="/">{{ 'packages.breadcrumbHome' | translate }}</a></p>
                <i class="fa fa-angle-double-right pt-1 px-3"></i>
                <p class="m-0 text-uppercase">{{ 'packages.breadcrumbPackages' | translate }}</p>
            </div>
        </div>
    </div>
</div>
<!-- Header End -->


<!-- Packages Start -->
<div class="container-fluid  bg-light">
    <div class="container pt-5 pb-3">
        <div class="text-center ">
            <p class="text-primary text-uppercase tracking-widest mb-2">{{ 'packages.eyebrow' | translate }}</p>
            <h1 class="font-bold text-4xl">{{ 'packages.heading' | translate }}</h1>
        </div>

        <div class="package-tabs" role="tablist" [attr.aria-label]="'packages.tabsAria' | translate">
            <button class="tab-btn-outline" [class.active]="activeTab==='multi'" (click)="setTab('multi')">
                {{ 'packages.tabMultiDay' | translate }}
            </button>
            <button class="tab-btn-outline" [class.active]="activeTab==='day'" (click)="setTab('day')">
                {{ 'packages.tabDay' | translate }}
            </button>
            <button class="tab-btn-outline" [class.active]="activeTab==='tuktuk'" (click)="setTab('tuktuk')">
                {{ 'packages.tabTukTuk' | translate }}
            </button>
        </div>

        <h2 class="h4 text-center mb-4">
          {{ activeTabLabelKey | translate }}
        </h2>

        <!-- Tab Content: center sparse grids so one card doesn’t sit alone on the left -->
        <div
          class="row package-grid"
          [class.package-grid--sparse]="activeTours.length > 0 && activeTours.length < 3"
          [class.package-grid--single]="activeTours.length === 1">
            <div *ngFor="let tour of activeTours; let i = index"
                class="mb-4 package-card-wrapper"
                [class.col-lg-4]="activeTours.length !== 1"
                [class.col-md-6]="activeTours.length !== 1"
                [class.col-lg-5]="activeTours.length === 1"
                [class.col-md-8]="activeTours.length === 1"
                [class.col-12]="activeTours.length === 1"
                [style.--i]="i">
                <app-package-item-component [image]="tour.image" [days]="tour.days" [persons]="tour.persons"
                    [rating]="tour.rating" [price]="tour.price" [title]="tour.title" [filecode]="tour.filecode" [routerLink]="tour.routerLink"
                    [titleLevel]="3"
                    class="package-card">
                </app-package-item-component>
            </div>
        </div>


    </div>
</div>



<!-- Packages End -->

<router-outlet></router-outlet>
<!-- Destination Start -->
