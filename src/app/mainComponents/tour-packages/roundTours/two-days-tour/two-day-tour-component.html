<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 text-center">
            <div class="d-flex align-items-start">
                <div class="main-image-container text-center">
                    <!-- Main Image -->
                    <img [src]="currentImage" class="main-img rounded shadow" alt="Tour Image" />
                    <!-- Indicators -->
                    <div class="indicators">
                        <span *ngFor="let img of images; let i = index"
                            (click)="goToImage(i)"
                            [class.active-indicator]="i === currentIndex"
                            class="indicator-dot">
                        </span>
                    </div>
                    <!-- Thumbnails (BOTTOM) -->
                    <div class="thumbs-bottom">
                        <div *ngFor="let img of nextImages"
                            class="thumb-img"
                            (click)="goToImageFromThumb(img.index)">
                        <img [src]="img.src" class="img-thumbnail rounded" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <app-tour-details-component [tour]="tourForDetails"></app-tour-details-component>
</div>

<div class="container-fluid py-5">
    <div class="container pt-5 pb-3">
        <div class="text-center mb-3 pb-3">
            <h6 class="text-primary text-uppercase" style="letter-spacing: 5px;">You might also like...</h6>
            <h1>High rated Tour</h1>
        </div>
        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let tour of selectedTours">
                <app-package-item-component [image]="tour.image" [days]="tour.days" [persons]="tour.persons"
                    [rating]="tour.rating" [price]="tour.price" [title]="tour.title" [routerLink]="tour.routerLink">
                </app-package-item-component>
            </div>
        </div>

    </div>
</div>

<div class="booking-fixed-card">
    <!-- Title -->
    <h5 class="booking-title">
        {{ tour.title }}
    </h5>

    <!-- Info Row -->
    <div class="booking-info">
        <div class="info-item">
            <i class="fa fa-clock"></i>
            <div>
                <span class="label">Duration</span>
                <span class="value">{{ tour.duration }}</span>
            </div>
        </div>
        <div class="info-item">
            <i class="fa fa-users"></i>
            <div>
                <span class="label">Group</span>

                <span class="value">
                    {{ getMainPersons(tour.persons) }}
                </span>

                <span class="sub-value">
                    ({{ getSubPersons(tour.persons) }})
                </span>
            </div>
        </div>
    </div>
    <!-- Divider -->
    <div class="divider"></div>
    <!-- Price -->
    <div class="booking-price">
        <span class="from">From</span>
        <span class="amount">${{ price }}</span>
        <span class="per">/ per group</span>
    </div>
    <!-- Button -->
    <button class="booking-btn" (click)="bookNow()">
        <i class="fa fa-calendar-check"></i>
        Book Now
    </button>
</div>
<button class="mobile-float-btn" (click)="bookNow()">
  <i class="fa fa-calendar-check"></i>
  Book Now
</button>
