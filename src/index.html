  <div id="cookie-consent" class="cookie-consent" role="dialog" aria-modal="false" aria-labelledby="cookie-consent-title" aria-describedby="cookie-consent-desc" hidden>
    <div class="cookie-consent__panel">
      <div class="cookie-consent__accent" aria-hidden="true"></div>
      <div class="cookie-consent__body">
        <div class="cookie-consent__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="#b8954a" stroke-width="1.5" opacity="0.55"/>
            <path d="M12 22c2.2-5.5 6-9 8-9s5.8 3.5 8 9c-2.4 1.6-5.1 2.5-8 2.5s-5.6-.9-8-2.5Z" fill="#b8954a" opacity="0.9"/>

          </svg>
        </div>
        <div class="cookie-consent__copy">
          <p class="cookie-consent__kicker">Your privacy</p>
          <p id="cookie-consent-title" class="cookie-consent__title">Cookies &amp; analytics</p>
          <p id="cookie-consent-desc" class="cookie-consent__text">
            We use analytics cookies to understand how travellers use Pabudu Tours — so we can improve the experience. Essential browsing works either way.
          </p>
        </div>
        <div class="cookie-consent__actions">
          <button type="button" class="cookie-consent__btn cookie-consent__btn--ghost" id="cookie-reject">Reject</button>
          <button type="button" class="cookie-consent__btn cookie-consent__btn--solid" id="cookie-accept">Accept analytics</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .cookie-consent {
      --cc-green: #012c13;
      --cc-gold: #b8954a;
      --cc-cream: #f4efe4;
      position: fixed;
      inset: auto 0 0 0;
      z-index: 10000;
      padding: 0 1rem max(1rem, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .cookie-consent[hidden] { display: none !important; }
    .cookie-consent:not([hidden]) .cookie-consent__panel {
      animation: cookie-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cookie-rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cookie-consent__panel {
      pointer-events: auto;
      position: relative;
      max-width: 920px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(120% 140% at 0% 100%, rgba(184, 149, 74, 0.18), transparent 55%),
        linear-gradient(135deg, #01351a 0%, var(--cc-green) 48%, #021f0e 100%);
      color: var(--cc-cream);
      border: 1px solid rgba(184, 149, 74, 0.4);
      box-shadow:
        0 0 0 1px rgba(1, 44, 19, 0.4),
        0 -18px 48px rgba(1, 44, 19, 0.4);
      font-family: Manrope, "Segoe UI", sans-serif;
    }
    .cookie-consent__accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cc-gold), transparent);
    }
    .cookie-consent__body {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.1rem 1.35rem;
      align-items: center;
      padding: 1.2rem 1.4rem 1.25rem;
    }
    .cookie-consent__mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(184, 149, 74, 0.1);
      border: 1px solid rgba(184, 149, 74, 0.28);
      flex-shrink: 0;
    }
    .cookie-consent__kicker {
      margin: 0 0 0.2rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(184, 149, 74, 0.95);
      font-weight: 700;
    }
    .cookie-consent__title {
      margin: 0 0 0.4rem;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.15rem, 2.4vw, 1.35rem);
      font-weight: 600;
      line-height: 1.2;
      color: #fff;
    }
    .cookie-consent__text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: rgba(244, 239, 228, 0.82);
      max-width: 38rem;
    }
    .cookie-consent__actions {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 11.5rem;
    }
    .cookie-consent__btn {
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.7rem 1.1rem;
      min-height: 44px;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .cookie-consent__btn:hover { transform: translateY(-1px); }
    .cookie-consent__btn:active { transform: translateY(0); }
    .cookie-consent__btn--ghost {
      order: 2;
      background: transparent;
      color: rgba(244, 239, 228, 0.88);
      border: 1px solid rgba(244, 239, 228, 0.28);
    }
    .cookie-consent__btn--ghost:hover {
      border-color: rgba(184, 149, 74, 0.7);
      color: var(--cc-gold);
    }
    .cookie-consent__btn--solid {
      order: 1;
      background: var(--cc-gold);
      color: var(--cc-green);
      box-shadow: 0 8px 18px rgba(184, 149, 74, 0.28);
    }
    .cookie-consent__btn--solid:hover {
      background: #c9a65a;
    }
    @media (max-width: 767.98px) {
      .cookie-consent {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      }
      .cookie-consent__body {
        grid-template-columns: auto 1fr;
        padding: 1.1rem 1.05rem 1.15rem;
      }
      .cookie-consent__mark { width: 44px; height: 44px; }
      .cookie-consent__mark svg { width: 32px; height: 32px; }
      .cookie-consent__actions {
        grid-column: 1 / -1;
        flex-direction: row-reverse;
        min-width: 0;
      }
      .cookie-consent__btn { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cookie-consent:not([hidden]) .cookie-consent__panel {
        animation: none;
      }
      .cookie-consent__btn { transition: none; }
      .cookie-consent__btn:hover { transform: none; }
    }
  </style>

  <script>
    (function () {
      var MEASUREMENT_ID = 'G-L3KP7T618Q';
      var STORAGE_KEY = 'pabudu_consent';
      var banner = document.getElementById('cookie-consent');
      var acceptBtn = document.getElementById('cookie-accept');
      var rejectBtn = document.getElementById('cookie-reject');

      function applyConsent(state) {
        gtag('consent', 'update', {
          ad_storage: state,
          ad_user_data: state,
          ad_personalization: state,
          analytics_storage: state
        });
        try { localStorage.setItem(STORAGE_KEY, state); } catch (e) {}
        if (banner) banner.hidden = true;
      }

      function loadAnalytics() {
        if (window.__analyticsLoaded) return;
        window.__analyticsLoaded = true;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
        s.async = true;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', MEASUREMENT_ID, { send_page_view: true });
      }

      function loadFontAwesome() {
        if (window.__faLoaded) return;
        window.__faLoaded = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'assets/css/fontawesome.min.css';
        css.onload = function () {
          var swap = document.createElement('link');
          swap.rel = 'stylesheet';
          swap.href = 'assets/css/fa-display-swap.css';
          document.head.appendChild(swap);
        };
        document.head.appendChild(css);
      }

      function loadBrandFonts() {
        if (window.__fontsLoaded) return;
        window.__fontsLoaded = true;
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=optional';
        document.head.appendChild(l);
      }

      function showBannerIfNeeded() {
        var saved = null;
        try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
        if (saved === 'granted' || saved === 'denied') {
          if (banner) banner.hidden = true;
          return saved;
        }
        if (banner) banner.hidden = false;
        return null;
      }

      if (acceptBtn) {
        acceptBtn.addEventListener('click', function () {
          applyConsent('granted');
          loadAnalytics();
        });
      }
      if (rejectBtn) {
        rejectBtn.addEventListener('click', function () {
          applyConsent('denied');
          setTimeout(loadAnalytics, 4000);
        });
      }

      var prior = showBannerIfNeeded();

      // Keep fonts/icons/analytics off the LCP critical path (Slow 4G lab tests).
      function scheduleDeferredAssets() {
        setTimeout(loadBrandFonts, 5000);
        setTimeout(loadFontAwesome, 6500);
        if (prior === 'granted' || prior === 'denied') {
          setTimeout(loadAnalytics, 4000);
        }
      }
      if (document.readyState === 'complete') {
        scheduleDeferredAssets();
      } else {
        window.addEventListener('load', scheduleDeferredAssets);
      }

      // Load icons/fonts sooner if the visitor interacts (scroll/tap)
      function onFirstInteract() {
        loadFontAwesome();
        loadBrandFonts();
      }
      // Don't bind scroll — Lighthouse scrolls during lab tests and would pull fonts early.
      window.addEventListener('touchstart', onFirstInteract, { passive: true, once: true });
      window.addEventListener('pointerdown', onFirstInteract, { once: true });
      window.addEventListener('keydown', onFirstInteract, { once: true });

      window.openCookiePreferences = function () {
        if (banner) banner.hidden = false;
      };
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/fa-display-swap.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=optional">
  </noscript>
